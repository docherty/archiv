<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#e94560" stroke-width="2"/>
  <!-- Sync arrows -->
  <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arrow (clockwise) -->
    <path d="M 84 44 A 30 30 0 0 1 84 84"/>
    <polyline points="74,44 84,44 84,54"/>
    <!-- Bottom arrow (counter-clockwise) -->
    <path d="M 44 84 A 30 30 0 0 1 44 44"/>
    <polyline points="54,84 44,84 44,74"/>
  </g>
  <!-- Center lock/key icon -->
  <g fill="#e94560">
    <rect x="56" y="62" width="16" height="14" rx="2"/>
    <circle cx="64" cy="58" r="8" fill="none" stroke="#e94560" stroke-width="4"/>
  </g>
</svg>
